# Build the technical note and publish it to GitHub Pages.
#
# IMPLEMENTATION.pdf is not tracked in git: a PDF is already compressed, so git
# cannot delta it, and every revision of the note would cost a full copy in the
# history.  Building it here keeps the readable note one click away from the
# README without paying that cost.
name: note

on:
  push:
    branches: [main]
    paths:
      - IMPLEMENTATION.tex
      - Makefile
      - .github/workflows/note.yml
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the in-flight one instead of cancelling it, so what is
# published always corresponds to the newest commit that finished building.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # amsart, booktabs, microtype, geometry, xcolor, hyperref and fancyvrb
      # come from these four; lmodern supplies the T1 fonts.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern

      - name: Build
        run: make

      # Pages serves the directory root, so index.html sends a visitor who
      # lands there on to the note itself.
      - name: Stage the site
        run: |
          mkdir -p site
          cp IMPLEMENTATION.pdf site/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>SteinFactorizationM2 -- technical note</title>
          <meta http-equiv="refresh" content="0; url=IMPLEMENTATION.pdf">
          <p><a href="IMPLEMENTATION.pdf">SteinFactorizationM2 technical note</a></p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
